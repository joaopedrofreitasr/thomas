<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>O Banquete do Thomas</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#14101f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc(100vh*0.625),440px);aspect-ratio:400/640;touch-action:none}
  canvas{width:100%;height:100%;display:block;border-radius:14px;background:#1d1633;touch-action:none}
  #ov{position:absolute;inset:0;border-radius:14px;background:rgba(15,10,30,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:10px;overflow:auto}
  #ov.hide{display:none}
  h1{margin:0;font-size:clamp(24px,7vw,32px);line-height:1.1;color:#ffb347;text-shadow:0 3px 0 #b34700}
  p{margin:0;font-size:clamp(13px,3.6vw,15px);line-height:1.35;color:#e9e4ff}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:clamp(12px,3.4vw,14px);text-align:left;background:#ffffff12;border-radius:10px;padding:8px 12px}
  .legend b.g{color:#7dff9b}.legend b.r{color:#ff6b6b}
  button,.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;color:#fff}
  #play{background:#ff7a00;font-size:clamp(16px,4.6vw,20px);box-shadow:0 4px 0 #b34700;width:100%;max-width:280px}
  #play:active{transform:translateY(3px);box-shadow:0 1px 0 #b34700}
  .btn{background:#3b2f66;display:inline-block;font-size:clamp(13px,3.6vw,15px)}
  #file{display:none}
  #prev{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #ffb347;background:#3b2f66;display:none}
  .big{font-size:clamp(30px,10vw,44px);font-weight:900;color:#ffb347}
  .roast{background:#ff3b3b22;border:1px solid #ff6b6b66;border-radius:10px;padding:10px 12px;color:#ffd0d0;font-weight:600}
  small{opacity:.6;font-size:11px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="640"></canvas>
  <div id="ov">
    <h1 id="ttl">O Banquete do Thomas</h1>
    <img id="prev" alt="">
    <p id="sub">Ajude Thomas a continuar imenso e fuja do emagrecimento</p>
    <div id="legend" class="legend">
      <span><b class="g">Cheetos</b> +100 🔥</span><span><b class="g">Nutella</b> +30</span>
      <span><b class="g">Bacon</b> +30</span><span><b class="g">Pizza</b> +25</span>
      <span><b class="g">Dogão</b> +25</span><span><b class="r">Academia, Salada, Mounjaro</b> = perde vida</span>
    </div>
    <div id="res" style="display:none"></div>
    <label class="btn" for="file">📸 Anexar foto do Thomas</label>
    <input type="file" id="file" accept="image/*">
    <button id="play">JOGAR</button>
    <small>Arraste o dedo / mouse ou use as setas ← →</small>
  </div>
</div>

  if(FOTO_EMBUTIDA){
    var emb=new Image();
    emb.onload=function(){photo=emb;prev.src=emb.src;prev.style.display='block'};
    emb.src=FOTO_EMBUTIDA;
    document.querySelector('label.btn').style.display='none';
  }
  file.addEventListener('change',function(){
    var f=file.files&&file.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){photo=im;prev.src=im.src;prev.style.display='block'};
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });

  function start(){
    score=0;lives=3;girth=0;items=[];pops=[];parts=[];t=0;spawnT=.5;combo=0;
    px=tx=W/2;state='play';ov.classList.add('hide');last=0;
    beep(520,.1);
  }
  play.addEventListener('click',start);

  function end(){
    state='over';
    var newBest=score>best;
    if(newBest){best=score;try{localStorage.setItem('thomasBest',String(best))}catch(e){}}
    var tier=TIERS[TIERS.length-1];
    for(var i=0;i<TIERS.length;i++){if(score<TIERS[i][0]){tier=TIERS[i];break}}
    ttl.textContent='💀 GAME OVER 💀';
    sub.style.display='none';legend.style.display='none';
    res.style.display='block';
    res.innerHTML='<div class="big">'+score+' pts</div>'+
      '<p style="margin:4px 0"><b>'+tier[1]+'</b>'+(newBest?' · 🏆 Novo recorde!':' · Recorde: '+best)+'</p>'+
      '<div class="roast">'+DEATH[lastBad]+'<br>'+tier[2]+'</div>'+
      '<p style="margin-top:8px"><small>Tire print e mande no grupo 😈</small></p>';
    play.textContent='JOGAR DE NOVO';
    ov.classList.remove('hide');
    beep(160,.5,'sawtooth',.07);
  }

  // input
  function setX(clientX){
    var r=cv.getBoundingClientRect();
    tx=(clientX-r.left)/r.width*W;
  }
  cv.addEventListener('pointermove',function(e){if(state==='play')setX(e.clientX)});
  cv.addEventListener('pointerdown',function(e){if(state==='play')setX(e.clientX)});
  window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key.indexOf('Arrow')===0)e.preventDefault()});
  window.addEventListener('keyup',function(e){keys[e.key]=false});

  function bodyRx(){return Math.min(30+girth*1.6,115)}

  function spawn(){
    var diff=Math.min(t/70,1);
    var isBad=Math.random()<(.28+.12*diff);
    var def;
    if(isBad)def=pick(BAD);
    else{
      var r=Math.random(),acc=0;def=GOOD[1];
      for(var i=0;i<GOOD.length;i++){acc+=GOOD[i].w;if(r<acc){def=GOOD[i];break}}
      if(r>=.22+.2*4)def=GOOD[0];
    }
    items.push({d:def,bad:isBad,x:rnd(30,W-30),y:-30,vy:rnd(150,210)+170*diff,rot:rnd(-.3,.3),vr:rnd(-2,2)});
  }

  function popup(x,y,txt,col){pops.push({x:x,y:y,t:0,txt:txt,col:col})}
  function burst(x,y,col){for(var i=0;i<12;i++)parts.push({x:x,y:y,vx:rnd(-160,160),vy:rnd(-220,-30),t:0,col:col})}

  function update(dt){
    t+=dt;
    var sp=380;
    if(keys['ArrowLeft']||keys['a']||keys['A'])tx-=sp*dt;
    if(keys['ArrowRight']||keys['d']||keys['D'])tx+=sp*dt;
    tx=Math.max(30,Math.min(W-30,tx));
    px+=(tx-px)*Math.min(1,dt*16);

    spawnT-=dt;
    if(spawnT<=0){spawn();spawnT=Math.max(.38,.95-.5*Math.min(t/70,1))*rnd(.8,1.15)}

    var rx=Math.max(bodyRx(),30);
    for(var i=items.length-1;i>=0;i--){
      var it=items[i];it.y+=it.vy*dt;it.rot+=it.vr*dt;
      var inX=Math.abs(it.x-px)<rx+it.d.r*.6;
      if(inX&&it.y+it.d.r>470&&it.y-it.d.r<585){
        items.splice(i,1);
        if(it.bad){
          lives--;lastBad=it.d.id;score=Math.max(0,score-50);combo=0;
          girth=Math.max(0,girth-9);shake=.35;flash=.4;
          popup(it.x,480,pick(it.d.msgs),'#ff6b6b');burst(it.x,500,'#ff4d4d');
          beep(140,.35,'sawtooth',.08);
          if(lives<=0){end();return}
        }else{
          combo++;
          var bonus=combo>=5?Math.floor(it.d.pts*.2):0;
          score+=it.d.pts+bonus;girth+=it.d.id==='cheetos'?4:2.5;
          popup(it.x,480,pick(it.d.msgs),it.d.id==='cheetos'?'#ffb347':'#7dff9b');
          burst(it.x,500,it.d.id==='cheetos'?'#ff8a00':'#ffe066');
          beep(it.d.id==='cheetos'?880:620,.12,'square',.05);
        }
      }else if(it.y>H+40){items.splice(i,1)}
    }
    for(var j=pops.length-1;j>=0;j--){pops[j].t+=dt;pops[j].y-=40*dt;if(pops[j].t>1.6)pops.splice(j,1)}
    for(var k=parts.length-1;k>=0;k--){var p=parts[k];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.t>.7)parts.splice(k,1)}
    if(shake>0)shake-=dt;if(flash>0)flash-=dt;
  }

  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

  function drawEmoji(e,x,y,size,rot){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
    ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,0,0);ctx.restore();
  }

  function drawItem(it){
    var id=it.d.id;
    if(id==='cheetos'){
      ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);
      ctx.shadowColor='#ffb300';ctx.shadowBlur=22;
      ctx.fillStyle='#ff8a00';rr(-22,-30,44,60,7);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(0,-2,15,0,7);ctx.fill();
      ctx.fillStyle='#c25400';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('CHEETOS',0,-2);
      ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.fillText('+100',0,21);
      ctx.restore();
    }else if(id==='nutella'){
      ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);
      ctx.fillStyle='#5a2d14';rr(-17,-22,34,44,6);ctx.fill();
      ctx.fillStyle='#c0262d';rr(-17,-22,34,10,4);ctx.fill();
      ctx.fillStyle='#f4ecd8';rr(-13,-6,26,18,3);ctx.fill();
      ctx.fillStyle='#5a2d14';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('NUTELLA',0,3);
      ctx.restore();
    }else if(id==='bacon')drawEmoji('🥓',it.x,it.y,44,it.rot);
    else if(id==='pizza')drawEmoji('🍕',it.x,it.y,44,it.rot);
    else if(id==='dogao')drawEmoji('🌭',it.x,it.y,44,it.rot);
    else drawEmoji(it.d.emoji,it.x,it.y,44,it.rot);
  }

  function drawPlayer(){
    var rx=bodyRx();
    // body
    ctx.fillStyle='#3a86ff';
    ctx.beginPath();ctx.ellipse(px,548,rx,40,0,0,7);ctx.fill();
    ctx.fillStyle='#ffffff30';ctx.beginPath();ctx.ellipse(px-rx*.3,538,rx*.35,14,0,0,7);ctx.fill();
    // belly stripes / cheetos stain
    ctx.fillStyle='#ff8a00';
    if(girth>10){ctx.beginPath();ctx.arc(px+rx*.35,556,6,0,7);ctx.fill()}
    // name tag
    ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('THOMAS',px,566);
    // head
    var hy=496,hr=30+Math.min(girth*.12,8);
    ctx.save();
    ctx.beginPath();ctx.arc(px,hy,hr,0,7);ctx.closePath();
    ctx.fillStyle='#f1c27d';ctx.fill();
    ctx.clip();
    if(photo){
      var s=Math.max(hr*2/photo.width,hr*2/photo.height);
      ctx.drawImage(photo,px-photo.width*s/2,hy-photo.height*s/2,photo.width*s,photo.height*s);
    }else{
      ctx.fillStyle='#000';ctx.font=(hr*1.6)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('😋',px,hy+2);
    }
    ctx.restore();
    ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(px,hy,hr,0,7);ctx.stroke();
  }

  function draw(){
    ctx.save();
    ctx.clearRect(0,0,W,H);
    if(shake>0)ctx.translate(rnd(-6,6),rnd(-6,6));
    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1f4d');g.addColorStop(1,'#14101f');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // floor
    ctx.fillStyle='#3b2f66';ctx.fillRect(0,590,W,50);
    for(var i=0;i<items.length;i++)drawItem(items[i]);
    drawPlayer();
    for(var k=0;k<parts.length;k++){var p=parts[k];ctx.globalAlpha=1-p.t/.7;ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,5,5)}
    ctx.globalAlpha=1;
    for(var j=0;j<pops.length;j++){
      var o=pops[j];ctx.globalAlpha=Math.max(0,1-o.t/1.6);
      ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      var x=Math.max(110,Math.min(W-110,o.x));
      ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(o.txt,x,o.y);
      ctx.fillStyle=o.col;ctx.fillText(o.txt,x,o.y);
    }
    ctx.globalAlpha=1;
    // HUD
    ctx.fillStyle='#00000055';rr(8,8,W-16,40,10);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText('🍽️ '+score,18,29);
    ctx.textAlign='center';ctx.font='12px sans-serif';ctx.fillStyle='#ffd9a0';
    ctx.fillText('recorde '+best,W/2,29);
    ctx.textAlign='right';ctx.font='18px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
    var h='';for(var l=0;l<3;l++)h+=l<lives?'❤️':'🖤';
    ctx.fillStyle='#fff';ctx.fillText(h,W-16,29);
    if(combo>=5){ctx.textAlign='center';ctx.font='bold 13px sans-serif';ctx.fillStyle='#ffb347';ctx.fillText('COMBO x'+combo+' (+20%)',W/2,64)}
    if(flash>0){ctx.fillStyle='rgba(255,0,0,'+(flash*.8)+')';ctx.fillRect(0,0,W,H)}
    ctx.restore();
  }

  function loop(ts){
    if(!last)last=ts;
    var dt=Math.min((ts-last)/1000,.05);last=ts;
    if(state==='play')update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
